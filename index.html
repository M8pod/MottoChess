<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F5C3F" />
  <title>Motto Chess</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/images/motto_chess_pawn_samurai_square.png" />
  <link rel="apple-touch-icon" href="assets/images/motto_chess_pawn_samurai_rounded.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app-main"></div>
  <div id="narrator-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // Rete di sicurezza: se il modulo principale non parte (es. errore di
    // sintassi), la pagina resta vuota e completamente muta per lo screen
    // reader. Meglio un messaggio annunciabile che una schermata morta.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var main = document.getElementById('app-main');
        if (main && main.childElementCount === 0) {
          var h1 = document.createElement('h1');
          h1.textContent = 'Motto Chess';
          var p = document.createElement('p');
          p.setAttribute('role', 'alert');
          p.textContent =
            "Errore di avvio: l'applicazione non si è caricata correttamente. Chiudi e riapri l'app per scaricare l'ultima versione.";
          main.append(h1, p);
        }
      }, 3000);
    });
  </script>
</body>
</html>
